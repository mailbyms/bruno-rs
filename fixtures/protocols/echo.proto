syntax = "proto3";

package echo;

message EchoRequest {
  string message = 1;
  int32 count = 2;
}

message EchoReply {
  string message = 1;
}

service Echo {
  rpc Unary (EchoRequest) returns (EchoReply);
  rpc Stream (EchoRequest) returns (stream EchoReply);
  rpc Collect (stream EchoRequest) returns (EchoReply);
  rpc Chat (stream EchoRequest) returns (stream EchoReply);
}
