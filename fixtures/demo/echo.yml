info:
  name: Echo GET
  type: http
  seq: 1

http:
  method: GET
  url: http://127.0.0.1:18081/hello

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "200"
    - expression: res.body.ok
      operator: eq
      value: "true"

settings:
  encodeUrl: true
  timeout: 0
